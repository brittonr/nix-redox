name: Binary cache

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push:
    name: Build and push (Nix ${{ matrix.nix }})
    if: vars.CACHIX_CACHE_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        nix: ["2.24.9", "2.35.1"]
    steps:
      - name: Check Cachix credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CACHIX_AUTH_TOKEN is not configured; skipping cache push"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.run == 'true'

      - uses: cachix/install-nix-action@v30
        if: steps.creds.outputs.run == 'true'
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ matrix.nix }}/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        if: steps.creds.outputs.run == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push the minimal and graphical images
        if: steps.creds.outputs.run == 'true'
        env:
          CACHE: ${{ vars.CACHIX_CACHE_NAME }}
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths .#redox-minimal .#redox-graphical > image-paths
          cat image-paths
          # Push the full closures, not only paths built in this step.
          cachix push "$CACHE" $(cat image-paths)
