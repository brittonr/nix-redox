[package]
name = "snix-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Pinned Snix pure-expression evaluator for the browser worker"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "2"
members = [".", "upstream/eval", "upstream/eval/builtin-macros"]

[workspace.package]
rust-version = "1.91.1"

# Versions from the pinned Snix workspace, not the Redox CLI's patched graph.
[workspace.dependencies]
bytes = "1.7.1"
bstr = "1.10.0"
codemap = "0.1.3"
codemap-diagnostic = "0.1.2"
genawaiter = { version = "0.99.1", default-features = false }
hashbrown = "0.15.4"
itertools = "0.12.1"
lexical-core = "0.8.5"
os_str_bytes = "6.6"
path-clean = "0.1"
proptest = { version = "1.5.0", default-features = false }
regex = "1.10.6"
rnix = "0.14.0"
rowan = "0.16"
serde = "1.0.209"
serde_json = "1.0"
smol_str = "0.2.2"
tabwriter = "1.4"
test-strategy = "0.2.1"
sha2 = "0.10.8"
sha1 = "0.10.6"
md-5 = "0.10.6"
data-encoding = "2.6.0"
rustc-hash = "2.0.0"
vu128 = "1.1.0"
thiserror = "2.0"
criterion = "0.5"
mimalloc = "0.1.43"
pretty_assertions = "1.4.0"
rstest = { version = "0.26.1", default-features = false }
tempfile = "3.12.0"
quote = "1.0.37"
proc-macro2 = "1.0.86"

[dependencies]
snix-eval = { path = "upstream/eval", default-features = false, features = ["no_leak"] }
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rnix.workspace = true
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
